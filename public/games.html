<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="preload" href="/fonts/anuphan-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/anuphan-3.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/theme-init.js"></script>
  <!--SEO-->
  <link rel="stylesheet" href="/style.css">
</head>
<body data-async>
  <header class="topbar glass-nav"></header>
  <main class="full-width catalog">
    <div class="catalog-glow" aria-hidden="true"></div>
    <div class="catalog-head">
      <h1 class="sec" id="catalogTitle"><span data-i18n="catalog.title">เกมทั้งหมด</span> <small id="count" aria-live="polite"></small></h1>
      <p class="catalog-sub" data-i18n="catalog.sub">เกมแท้ทุกเกม รับโค้ดทันทีหลังชำระเงิน — เลือกแนวที่ชอบ หรือกรองตามแพลตฟอร์มและราคา</p>
    </div>
    <!-- ช่องแนวเกมแบบ bento (JS เติมจาก /api/games/facets) — CSS จองความสูงไว้ก่อน ไม่ดันเนื้อหาตอนเติม -->
    <nav id="genreBento" class="genre-bento" data-i18n-label="catalog.genres"></nav>
    <button id="filtersToggle" class="btn filters-toggle" type="button" aria-haspopup="dialog"><span data-i18n="filter.toggle">ตัวกรองและการเรียง</span> <span id="filtersCount" class="filters-count"></span></button>
    <!-- ตัวกรอง: จอกว้างเป็นแถบกระจกติดใต้ header (dialog ทำตัวเป็นกล่องเปล่า) / มือถือเป็นแผงเลื่อนขึ้นจากล่างจอ (filter-sheet.js เปิดด้วย showModal) — ฟอร์มเดียวกัน ใช้ค่าแล้วกรองทันที -->
    <dialog id="filterSheet" class="filter-sheet" aria-labelledby="fsTitle">
      <div class="fs-grip" aria-hidden="true"></div>
      <div class="fs-head"><h2 id="fsTitle" data-i18n="filter.title">ตัวกรอง</h2><button class="fs-close" id="filtersClose" type="button" data-i18n-label="common.close" aria-label="ปิด"><svg class="icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <form id="filters" class="filters filter-bar">
        <select name="genre" id="genre" aria-label="genre"><option value="" data-i18n="filter.allGenres"></option></select>
        <select name="platform" id="platform" aria-label="platform"><option value="" data-i18n="filter.allPlatforms"></option></select>
        <div class="price-pair">
          <input name="minPrice" type="number" min="0" inputmode="numeric" data-i18n-placeholder="filter.minPrice" data-i18n-label="filter.minPrice">
          <input name="maxPrice" type="number" min="0" inputmode="numeric" data-i18n-placeholder="filter.maxPrice" data-i18n-label="filter.maxPrice">
        </div>
        <label class="check"><input type="checkbox" name="onSale" value="1"> <span data-i18n="filter.onSale"></span></label>
        <select name="sort" aria-label="sort">
          <option value="default" data-i18n="sort.default"></option>
          <option value="bestseller" data-i18n="sort.bestseller"></option>
          <option value="newest" data-i18n="sort.newest"></option>
          <option value="priceAsc" data-i18n="sort.priceAsc"></option>
          <option value="priceDesc" data-i18n="sort.priceDesc"></option>
          <option value="rating" data-i18n="sort.rating"></option>
          <option value="discount" data-i18n="sort.discount"></option>
        </select>
        <button class="btn reset-btn" type="reset" data-i18n="filter.reset"></button>
      </form>
      <div class="fs-foot"><button class="btn primary big" id="filtersDone" type="button" data-i18n="filter.done">ดูผลลัพธ์</button></div>
    </dialog>
    <div id="activeFilters" class="active-filters" data-i18n-label="filter.active" role="group" hidden></div>
    <div id="grid" class="grid" aria-busy="true"><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div><div class="card sk" aria-hidden="true"><div class="cover sk-cover"></div><div class="info sk-info"></div></div></div>
    <div id="empty" class="empty" hidden></div>
    <nav id="pager" class="pager"></nav>
  </main>
  <footer></footer>
  <script type="module" src="/js/catalog.js"></script>
</body>
</html>
