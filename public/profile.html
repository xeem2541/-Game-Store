<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/theme-init.js"></script>
  <title data-i18n="profile.title">บัญชีของฉัน</title>
  <link rel="preload" href="/fonts/anuphan-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/anuphan-3.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-async>
  <header class="topbar"></header>
  <main>
    <h1 class="sec" data-i18n="profile.title"></h1>
    <div id="verifyBanner" class="banner" hidden>
      <span data-i18n="profile.unverified"></span>
      <button class="btn" id="resendBtn" type="button" data-i18n="profile.resend"></button>
    </div>
    <section id="stats" class="profile-stats" data-i18n-label="profile.summary" aria-label="สรุปบัญชี" aria-busy="true">
      <div class="tile sk-tile" aria-hidden="true"></div><div class="tile sk-tile" aria-hidden="true"></div><div class="tile sk-tile" aria-hidden="true"></div><div class="tile sk-tile" aria-hidden="true"></div>
    </section>
    <div class="chips tabs" role="tablist">
      <button class="chip" role="tab" data-tab="info" data-i18n="profile.tab.info"></button>
      <button class="chip" role="tab" data-tab="password" data-i18n="profile.tab.password"></button>
      <button class="chip" role="tab" data-tab="orders" data-i18n="profile.tab.orders"></button>
      <button class="chip" role="tab" data-tab="library" data-i18n="profile.tab.library"></button>
      <button class="chip" role="tab" data-tab="wishlist" data-i18n="profile.tab.wishlist"></button>
    </div>
    <section id="panel" class="panel" role="tabpanel"></section>
  </main>
  <footer></footer>
  <script type="module" src="/js/profile.js"></script>
</body>
</html>
