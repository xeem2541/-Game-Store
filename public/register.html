<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/theme-init.js"></script>
  <title data-i18n="auth.register">สมัครสมาชิก</title>
  <link rel="preload" href="/fonts/anuphan-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/anuphan-3.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="register">
  <header class="topbar"></header>
  <main class="auth-box">
    <h1 data-i18n="auth.register">สมัครสมาชิก</h1>
    <form id="form" novalidate>
      <label><span data-i18n="auth.name"></span>
        <input name="name" type="text" required autocomplete="name" maxlength="80"></label>
      <label><span data-i18n="auth.email"></span>
        <input name="email" type="email" required autocomplete="email" ></label>
      <label><span data-i18n="auth.password"></span>
        <input name="password" type="password" required autocomplete="new-password" minlength="8" maxlength="72"></label>
      <small data-i18n="auth.passwordHint"></small>
      <p id="msg" class="msg" role="alert"></p>
      <button class="btn primary big" type="submit" data-i18n="auth.register"></button>
    </form>
    <p class="alt"><a href="/login" data-i18n="auth.haveAccount"></a></p>
  </main>
  <footer></footer>
  <script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
