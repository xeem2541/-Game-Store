<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/theme-init.js"></script>
  <title data-i18n="auth.verify">ยืนยันอีเมล</title>
  <link rel="preload" href="/fonts/anuphan-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/anuphan-3.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="verify">
  <header class="topbar"></header>
  <main class="auth-split">
    <div class="auth-art">
      <div class="auth-stack" aria-hidden="true"><span class="aa-card"></span><span class="aa-card"></span><span class="aa-card"></span></div>
      <div class="auth-art-text">
        <p class="auth-art-eyebrow">GAME <b>STORE</b></p>
        <p class="auth-art-title" data-i18n="authArt.title">เกมแท้ รับโค้ดทันที</p>
        <ul class="auth-art-points">
          <li data-i18n="authArt.p1">โค้ดแสดงทันทีหลังชำระเงิน และส่งทางอีเมล</li>
          <li data-i18n="authArt.p2">บัตรเครดิต/เดบิต หรือ PromptPay</li>
          <li data-i18n="authArt.p3">คลังเกมเก็บโค้ดไว้ให้ดูได้ทุกเมื่อ</li>
        </ul>
      </div>
    </div>
    <section class="auth-box">
      <h1 data-i18n="auth.verify">ยืนยันอีเมล</h1>
      <p id="msg" class="msg" role="status" data-i18n="auth.verifying"></p>
      <p class="alt"><a class="btn primary" href="/profile" data-i18n="auth.toProfile"></a></p>
    </section>
  </main>
  <footer></footer>
  <script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
