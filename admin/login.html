<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <script src="/js/theme-init.js"></script>
  <title>เข้าสู่ระบบหลังบ้าน</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="card auth-box">
    <h1>🎮 Game Store — หลังบ้าน</h1>
    <form id="form" novalidate>
      <label class="f">อีเมล<input name="email" type="email" required autocomplete="username"></label>
      <label class="f">รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
    </form>
  </main>
  <script src="/admin/login.js"></script>
</body>
</html>
